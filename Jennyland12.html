<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>𐙚 JENNY SHOP ⁎ ♡</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@300;400;500;700;800&family=Mitr:wght@300;400;500;600&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            list-style: none !important;
            list-style-type: none !important;
            box-sizing: border-box;
        }

        *::marker {
            display: none !important;
            content: "" !important;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Mitr', sans-serif;
            background: linear-gradient(-45deg, #FFB7C5, #FFE4E1, #FFD1DC, #FBC5D8, #FFE5EC);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
            position: relative;
            color: #6D4C57;
            transition: background 0.5s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatParticle {
            0% { transform: translateY(-5vh) rotate(0deg) scale(0.7); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(180deg) scale(1.1); opacity: 0; }
        }

        .cafe-drop {
            position: fixed;
            font-size: 20px;
            animation: floatParticle linear forwards;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(226, 73, 120, 0.3));
        }

        .viewport-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding: 12px;
        }

        .device-container {
            width: 100%;
            max-width: 400px;
            height: 96vh;
            height: 96dvh;
            max-height: 870px;
            background: #FFF9FA;
            position: relative;
            border-radius: 42px;
            border: 7px solid #FFFFFF;
            box-shadow: 0 20px 50px rgba(244, 143, 177, 0.35), 0 0 30px rgba(255, 182, 193, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 20;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            transform: translateZ(0);
        }

        @media (min-width: 768px) {
            .device-container {
                height: 92vh;
                height: 92dvh;
                border-radius: 46px;
                border: 8px solid #FFFFFF;
            }
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            padding: 12px 22px 4px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #E24978;
            font-size: 0.85rem;
            font-weight: 800;
            z-index: 90;
            background: transparent;
            pointer-events: auto;
        }

        .mini-music-btn {
            background: #FFF0F4;
            border: 1px solid #FFC2D1;
            color: #E24978;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(226, 73, 120, 0.2);
            transition: all 0.3s ease;
            outline: none;
        }

        .mini-music-btn:active {
            transform: scale(0.92);
        }

        .mini-music-btn.playing {
            background: #FFE5EC;
            color: #C2185B;
            border-color: #FF85A1;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 133, 161, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(255, 133, 161, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 133, 161, 0); }
        }

        .horizontal-cover-widget {
            position: relative;
            margin: 48px 16px 12px 16px;
            border-radius: 26px;
            overflow: hidden;
            height: 160px;
            background-color: #FFF0F4;
            box-shadow: 0 8px 22px rgba(226, 73, 120, 0.18), inset 0 0 0 2px #FFE5EC;
            transition: transform 0.3s ease;
            z-index: 40;
            flex-shrink: 0;
        }

        .cover-bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .screen {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 20px 16px;
            position: relative;
            scrollbar-width: none;
        }
        .screen::-webkit-scrollbar {
            display: none;
        }

        .app-grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding-top: 6px;
            padding-bottom: 24px;
        }

        .app-card-block {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.28);
            border: 2px solid #FFE5EC;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            min-height: 125px;
        }

        .app-card-block:hover {
            transform: translateY(-3px);
            border-color: #FFB3C6;
            box-shadow: 0 12px 24px rgba(226, 73, 120, 0.22);
        }

        .app-card-block:active {
            transform: scale(0.95);
            background: #FFF0F4;
        }

        .app-icon-square {
            width: 50px;
            height: 50px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.35rem;
            color: #E24978;
            background-color: #FFE5EC;
            border: 1px solid #FFC2D1;
            transition: all 0.2s ease;
            margin-bottom: 10px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .app-title-main {
            color: #4A323A;
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .app-title-sub {
            color: #A36B7E;
            font-size: 0.68rem;
            font-weight: 600;
            margin-top: 4px;
            line-height: 1.1;
        }

        .detail-view {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            z-index: 80;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            border-radius: inherit;
            overflow: hidden;
        }

        .detail-view.active {
            transform: translateX(0);
        }

        .detail-header {
            padding-top: 46px;
            padding-bottom: 12px;
            padding-left: 14px;
            padding-right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #FFE5EC;
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
        }

        .back-btn {
            font-size: 0.78rem;
            color: #E24978;
            background: #FFF0F4;
            padding: 6px 12px;
            border-radius: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            border: 1px solid #FFC2D1;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .back-btn:active {
            transform: scale(0.92);
        }

        .detail-title {
            flex: 1;
            padding: 0 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .detail-header-spacer {
            width: 80px;
            flex-shrink: 0;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 40px;
        }

        .list-item {
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(255, 182, 193, 0.18);
            border: 1.5px solid #FFE5EC;
            width: 100%;
        }

        .number-text {
            font-size: 0.92rem;
            font-weight: 800;
            color: #C2185B;
            letter-spacing: 0.3px;
        }

        .copy-btn {
            background: #FFE5EC;
            color: #E24978;
            border: 1px solid #FFC2D1;
            border-radius: 12px;
            padding: 6px 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .copy-btn:active {
            transform: scale(0.92);
            background: #E24978;
            color: #FFFFFF;
        }

        .profile-img-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #FFC2D1;
            padding: 4px;
            background: white;
            box-shadow: 0 10px 25px rgba(226, 73, 120, 0.25);
            margin: 0 auto 12px auto;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(109, 76, 87, 0.45);
            backdrop-filter: blur(5px);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #FFFFFF;
            width: 90%;
            max-width: 360px;
            border-radius: 28px;
            padding: 22px 18px;
            box-shadow: 0 20px 40px rgba(226, 73, 120, 0.25);
            border: 2px solid #FFC2D1;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background-color: #FFC2D1;
            border-radius: 10px;
            z-index: 90;
        }

        .toast-notification {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #E24978;
            color: #FFFFFF;
            padding: 9px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(226, 73, 120, 0.35);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 100;
            transition: top 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-notification.show {
            top: 52px;
        }

        .review-input, .review-textarea {
            user-select: auto;
        }
    </style>
</head>

        function compressImageToBase64(file, maxSizeBytes = 400000) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onerror = error => reject(error);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onerror = error => reject(error);
                    img.onload = () => {
                        let quality = 0.75;
                        let maxDimension = 800;
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        function processCompression() {
                            let width = img.width;
                            let height = img.height;

                            if (width > maxDimension || height > maxDimension) {
                                if (width > height) {
                                    height = Math.round((height * maxDimension) / width);
                                    width = maxDimension;
                                } else {
                                    width = Math.round((width * maxDimension) / height);
                                    height = maxDimension;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            ctx.clearRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);

                            const dataUrl = canvas.toDataURL('image/jpeg', quality);

                            if (dataUrl.length > maxSizeBytes && quality > 0.2) {
                                quality -= 0.15;
                                maxDimension = Math.round(maxDimension * 0.8);
                                processCompression();
                            } else {
                                resolve(dataUrl);
                            }
                        }

                        processCompression();
                    };
                };
            });
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('#starSelection i');

                if (index < rating) {

                } else {
                    star.classList.remove('text-pink-500', 'drop-shadow-sm');
                    star.classList.add('text-gray-300');
                }
            });
        }

        async function submitReview() {

            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitIcon = document.getElementById('submitIcon');

                return;

            submitBtn.classList.add('opacity-70');
            submitIcon.className = 'fas fa-spinner fa-spin';
            submitText.textContent = 'กำลังบีบอัดและส่งข้อมูล...';

            let evidenceBase64 = null;
            if (fileInput.files.length > 0) {
                try {
                    evidenceBase64 = await compressImageToBase64(fileInput.files[0]);
                } catch (e) {
                    console.error("Error compressing image:", e);
                }
            }

            const now = new Date();
            const dateStr = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const newReviewData = {
                name: name,
                channel: channel,
                comment: comment,
                rating: currentRating,
                date: dateStr,
                evidence: evidenceBase64,
                timestamp: db ? firebase.firestore.FieldValue.serverTimestamp() : new Date()

                    await db.collection("jenny_reviews").add(newReviewData);

            document.getElementById('reviewChannel').value = '';
            document.getElementById('reviewComment').value = '';

            setRating(0);
            
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-70');
            submitIcon.className = 'fas fa-paper-plane';
            submitText.textContent = 'ส่งรีวิวค่ะ ✨';

        function copyToClipboard(text, event) {
            if(event) event.stopPropagation();
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("คัดลอกข้อมูลเรียบร้อยแล้วค่ะ ✨", "fa-check-circle");
        }

        const particles = ['🐰', '🧁', '✨', '🌸'];
        function spawnParticle() {
            const drop = document.createElement('div');
            drop.className = 'cafe-drop';
            drop.textContent = particles[Math.floor(Math.random() * particles.length)];
            drop.style.left = (Math.random() * 92 + 4) + 'vw';
            const duration = Math.random() * 4 + 5;
            drop.style.animationDuration = duration + 's';
            drop.style.fontSize = (Math.random() * 8 + 16) + 'px';
            document.body.appendChild(drop);
            setTimeout(() => { drop.remove(); }, duration * 1000);
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            clockElement.innerHTML = `<i class="fas fa-heart text-pink-500 mr-1.5"></i>${hours}:${minutes}`;
        }

        window.onload = () => {
            initAppGrid();
            updateClock();
            initFirebaseReviews();

            setInterval(updateClock, 10000);
            setInterval(spawnParticle, 1000);

            const startAutoMusic = () => {
                if (!isPlaying) {
                    bgMusic.play().catch(e => console.log("รออนุญาตเล่นเสียง"));
                }
            };
            document.addEventListener('click', startAutoMusic, { once: true });
            document.addEventListener('touchstart', startAutoMusic, { once: true });
        };
